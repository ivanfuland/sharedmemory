[project]
name = "sharedmemory"
version = "0.0.1"
description = "M0 contract artifacts for the shared-memory layer"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2,<4",
    "msgpack>=1.0",          # 解 CASS canonical 的 messages.extra_bin(rmp_serde msgpack)
]

[project.optional-dependencies]
# notes_adapter 运行态依赖（R9 nit6）：frontmatter.py 的严格 YAML loader 需要
# pyyaml，此前只靠 dev/probe 依赖组的传递依赖凑巧满足，干净安装会导入失败。
# tiktoken/lancedb 等只在 probe 环境用的重依赖不进此 extra。
notes = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["distill", "cass_mcp", "notes_adapter", "cass_corpus"]

[dependency-groups]
dev = [
    "blake3>=1.0.9",
    "pytest>=8.0",
]
probe = [
    "transformers>=4.40",
    "tokenizers>=0.19",
]
mcp-shadow = [
    "transformers>=4.40",
    "tokenizers>=0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests", "everos_eval/tests"]
markers = [
    "slow: long-running acceptance tests (real doctor / full NAS readback)",
    "realcass: requires the real cass binary on PATH",
    "nas: writes to a real NAS scratch dir (CASS_ACCEPT_NAS=1)",
    "live: requires real probe-2b data via EVEROS_PROBE2B_DATA env var (skipped by default)",
]
