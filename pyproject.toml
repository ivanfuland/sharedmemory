[project]
name = "sharedmemory"
version = "0.0.1"
description = "M0 contract artifacts for the shared-memory layer"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["distill", "cass_mcp"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
