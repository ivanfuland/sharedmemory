[project]
name = "sharedmemory"
version = "0.0.1"
description = "M0 contract artifacts for the shared-memory layer"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2,<4",
    "msgpack>=1.0",          # 解 CASS canonical 的 messages.extra_bin(rmp_serde msgpack)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["distill", "cass_mcp"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running acceptance tests (real doctor / full NAS readback)",
    "realcass: requires the real cass binary on PATH",
    "nas: writes to a real NAS scratch dir (CASS_ACCEPT_NAS=1)",
]
